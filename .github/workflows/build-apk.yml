name: Build MOVIS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MubasherSportAndroid_beIN.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Extract project
        run: |
          test -f MubasherSportAndroid_beIN.zip
          unzip -q MubasherSportAndroid_beIN.zip -d extracted
          find extracted -type f -path '*/app/build.gradle' -print

      - name: Build APK
        run: |
          APP_GRADLE=$(find extracted -type f -path '*/app/build.gradle' -print -quit)
          test -n "$APP_GRADLE"
          PROJECT_DIR=$(dirname "$(dirname "$APP_GRADLE")")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOVIS-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
